<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SafirCharge — تنظیمات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app-mobile.css">
</head>
<body data-no-tab>
<div class="phone">
  <div class="appbar" style="padding-top:2px">
    <button class="ab-btn" onclick="location.href='account.html'"><span data-ic="back"></span></button>
    <div style="flex:1"><div class="ab-title">تنظیمات</div></div>
  </div>

  <div class="screen">
    <!-- ظاهر -->
    <div class="sec-title" style="margin-top:6px">ظاهر برنامه</div>
    <div class="card card-p">
      <div class="srow"><span class="sr-ic ic-violet" data-ic="eye"></span><span class="l-title" style="flex:1">حالت تیره</span><span class="switch" data-sw id="darkSw"><i></i></span></div>
      <div class="srow" style="border-bottom:none"><span class="sr-ic ic-blue" data-ic="bolt"></span><span class="l-title" style="flex:1">رنگ برنامه</span>
        <span class="acc-dots" id="accDots"></span>
      </div>
    </div>

    <!-- زبان و واحد -->
    <div class="sec-title">زبان و واحدها</div>
    <div class="card card-p">
      <div class="srow"><span class="sr-ic ic-green" data-ic="check"></span><span class="l-title" style="flex:1">زبان</span><span class="seg-mini" id="lang"><button class="active">فارسی</button><button>English</button></span></div>
      <div class="srow" style="border-bottom:none"><span class="sr-ic ic-orange" data-ic="leaf"></span><span class="l-title" style="flex:1">واحد انرژی</span><span class="seg-mini"><button class="active">kWh</button><button>درصد</button></span></div>
    </div>

    <!-- اعلان‌ها -->
    <div class="sec-title">اعلان‌ها</div>
    <div class="card card-p">
      <div class="srow"><span class="sr-ic ic-blue" data-ic="bell"></span><span class="l-title" style="flex:1">پوش اپلیکیشن</span><span class="switch on" data-sw><i></i></span></div>
      <div class="srow"><span class="sr-ic ic-green" data-ic="bolt"></span><span class="l-title" style="flex:1">پیامک پایان شارژ</span><span class="switch on" data-sw><i></i></span></div>
      <div class="srow" style="border-bottom:none"><span class="sr-ic ic-orange" data-ic="wallet"></span><span class="l-title" style="flex:1">هشدار کمبود موجودی</span><span class="switch on" data-sw><i></i></span></div>
    </div>

    <!-- شارژ -->
    <div class="sec-title">ترجیحات شارژ</div>
    <div class="card card-p">
      <div class="srow"><span class="sr-ic ic-blue" data-ic="bolt"></span><div class="l-main"><div class="l-title">حد توقف خودکار شارژ</div><div class="l-sub">شارژ تا این درصد ادامه می‌یابد</div></div><span class="seg-mini"><button>۸۰٪</button><button class="active">۹۰٪</button><button>۱۰۰٪</button></span></div>
      <div class="srow" style="border-bottom:none"><span class="sr-ic ic-green" data-ic="scan"></span><span class="l-title" style="flex:1">شارژ خودکار با پلاک</span><span class="switch on" data-sw><i></i></span></div>
    </div>

    <div class="center-col mt20 mb"><span class="fs12 muted">SafirCharge · نسخهٔ ۲٫۴٫۱</span></div>
  </div>
</div>

<style>
.srow{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--border-2)}
.sr-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}.sr-ic svg{width:20px;height:20px}
.l-title{font-weight:700;font-size:13.5px}.l-sub{font-size:11px;color:var(--muted);margin-top:2px}
.switch{width:46px;height:26px;border-radius:20px;background:var(--surface-3);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch i{position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:transform .18s}
.switch.on{background:var(--green)}
html[dir=rtl] .switch.on i{transform:translateX(-20px)}
.seg-mini{display:flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px}
.seg-mini button{border:none;background:transparent;color:var(--text-2);font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:8px;font-family:inherit}
.seg-mini button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.acc-dots{display:flex;gap:7px}
.acc-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border);padding:0;cursor:pointer}
.acc-dot.on{box-shadow:0 0 0 2px var(--accent)}
.mb{margin-bottom:8px}
</style>

<script src="../assets/app-mobile.js"></script>
<script>
(function(){
  // وضعیت تم
  if(document.documentElement.getAttribute('data-theme')==='dark')document.getElementById('darkSw').classList.add('on');

  // رنگ‌ها
  var ACC=[{v:'#0E6BA8',rgb:'14, 107, 168'},{v:'#16A34A',rgb:'22, 163, 74'},{v:'#F97316',rgb:'249, 115, 22'},{v:'#7C3AED',rgb:'124, 58, 237'},{v:'#0891B2',rgb:'8, 145, 178'}];
  var cur=localStorage.getItem('cn-accent')||'#0E6BA8';
  document.getElementById('accDots').innerHTML=ACC.map(function(a){return '<button class="acc-dot'+(a.v===cur?' on':'')+'" data-v="'+a.v+'" data-rgb="'+a.rgb+'" style="background:'+a.v+'"></button>';}).join('');
  document.querySelectorAll('.acc-dot').forEach(function(d){
    d.addEventListener('click',function(){
      var v=d.getAttribute('data-v'),rgb=d.getAttribute('data-rgb');
      document.documentElement.style.setProperty('--accent',v);
      document.documentElement.style.setProperty('--accent-rgb',rgb);
      localStorage.setItem('cn-accent',v);
      document.querySelectorAll('.acc-dot').forEach(function(x){x.classList.remove('on');});d.classList.add('on');
    });
  });

  document.querySelectorAll('[data-sw]').forEach(function(s){
    s.addEventListener('click',function(){
      s.classList.toggle('on');
      if(s.id==='darkSw'){var dark=s.classList.contains('on');document.documentElement.setAttribute('data-theme',dark?'dark':'light');localStorage.setItem('cn-theme',dark?'dark':'light');}
    });
  });
  document.querySelectorAll('.seg-mini').forEach(function(g){
    g.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){g.querySelectorAll('button').forEach(function(x){x.classList.remove('active');});b.classList.add('active');});});
  });
})();
</script>
</body>
</html>
