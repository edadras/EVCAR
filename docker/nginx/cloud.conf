server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 64M;

    # DNS داخلی داکر؛ با upstream متغیر، IP کانتینرها بعد از ری‌استارت دوباره resolve می‌شود (وگرنه 502)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ocpp_upstream sc_cloud_ocpp:9100;
    set $app_upstream sc_cloud_app:9000;

    # OCPP 1.6J WebSocket برای ایستگاه‌های بدون Edge: ws://<cloud-host>/ocpp/<ChargePointId>
    location /ocpp/ {
        proxy_pass http://$ocpp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $app_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
